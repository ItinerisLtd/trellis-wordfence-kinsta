name: Releases

on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Get tag
        id: get_tag
        run: echo ::set-output name=value::${GITHUB_REF/refs\/tags\//}

      - name: Create archive
        run: zip -r -9 trellis-wordfence-kinsta.zip *

      - name: Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          body: Version ${{ steps.get_tag.value }}
          files: trellis-wordfence-kinsta.zip
